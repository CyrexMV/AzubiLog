<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>AzubiLog</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#0b1220;color:#edf3fb;font:15px system-ui}main{max-width:760px;margin:auto}h1{margin:5px 0;color:#66d6b1}p,small{color:#93a4ba}.card{background:#152338;border:1px solid #26364c;border-radius:16px;padding:16px;margin:14px 0}input,textarea,select{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #34465e;border-radius:9px;background:#0c1625;color:white;font:inherit}textarea{min-height:90px}button{border:0;border-radius:10px;padding:11px 15px;margin:4px;background:#66d6b1;color:#08251c;font-weight:700}button.secondary{background:#26364c;color:white}.entry{padding:12px;border-bottom:1px solid #34465e}.entry b{display:block}.muted{color:#93a4ba}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media print{body{background:white;color:black}.card{background:white;color:black;border:0}.no-print{display:none!important}.entry{border-color:#aaa}.muted,p{color:#333}}</style></head><body><main><header><h1>AzubiLog</h1><p>Dein digitales Berichtsheft</p></header><section class="card"><h2>Dein Profil</h2><input id="name" placeholder="Vor- und Nachname"><input id="job" placeholder="Ausbildungsberuf"><input id="company" placeholder="Ausbildungsbetrieb"><div class="row"><select id="year"><option value="1">1. Ausbildungsjahr</option><option value="2">2. Ausbildungsjahr</option><option value="3">3. Ausbildungsjahr</option><option value="4">4. Ausbildungsjahr</option></select><input id="start" type="date"></div><button onclick="saveProfile()">Profil speichern</button></section><section class="card no-print"><h2>Tagesbericht eintragen</h2><input id="date" type="date"><textarea id="task" placeholder="Was hast du heute gemacht und gelernt?"></textarea><div class="row"><input id="hours" type="number" min="0" max="24" step=".25" value="8" placeholder="Stunden"><select id="kind"><option>Betrieb</option><option>Berufsschule</option><option>Urlaub</option><option>Krankheit</option><option>Sonstiges</option></select></div><input id="note" placeholder="Bemerkungen (optional)"><button onclick="addEntry()">Eintrag speichern</button></section><section class="card"><h2>Wochenbericht</h2><p id="week"></p><div id="list"></div><p id="total"></p><div class="actions no-print"><button onclick="exportPDF()">Wochenbericht als PDF drucken</button><button class="secondary" onclick="backup()">Daten sichern (JSON)</button><button class="secondary" onclick="document.getElementById('restore').click()">Sicherung importieren</button><input id="restore" type="file" accept="application/json" hidden onchange="restore(event)"></div></section></main><script>const $=x=>document.getElementById(x),key='azubilog_android_v1';let db=JSON.parse(localStorage.getItem(key)||'{"profile":{},"entries":[]}');function persist(){localStorage.setItem(key,JSON.stringify(db))}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function monday(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);x.setHours(0,0,0,0);return x}function safe(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function saveProfile(){db.profile={name:$('name').value,job:$('job').value,company:$('company').value,year:$('year').value,start:$('start').value};persist();render();alert('Profil gespeichert')}function addEntry(){if(!$('date').value||!$('task').value.trim())return alert('Bitte Datum und Tätigkeit eintragen.');db.entries.push({id:Date.now(),date:$('date').value,task:$('task').value.trim(),hours:Number($('hours').value),kind:$('kind').value,note:$('note').value});persist();$('task').value='';$('note').value='';render()}function del(id){if(confirm('Eintrag löschen?')){db.entries=db.entries.filter(e=>e.id!==id);persist();render()}}function render(){let p=db.profile;$('name').value=p.name||'';$('job').value=p.job||'';$('company').value=p.company||'';$('year').value=p.year||'1';$('start').value=p.start||'';let m=monday(new Date()),end=new Date(m);end.setDate(end.getDate()+6);$('week').textContent='Woche '+m.toLocaleDateString('de-DE')+' – '+end.toLocaleDateString('de-DE');let es=db.entries.filter(e=>e.date>=iso(m)&&e.date<=iso(end)).sort((a,b)=>a.date.localeCompare(b.date));$('list').innerHTML=es.length?es.map(e=>'<article class="entry"><b>'+safe(new Date(e.date+'T12:00:00').toLocaleDateString('de-DE'))+' · '+safe(e.kind)+' · '+e.hours+' h</b>'+safe(e.task)+'<div class="muted">'+safe(e.note)+'</div><button class="secondary no-print" onclick="del('+e.id+')">Löschen</button></article>').join(''):'<p class="muted">Noch keine Einträge in dieser Woche.</p>';$('total').textContent='Einträge: '+es.length+' · Stunden: '+es.reduce((a,e)=>a+e.hours,0)+' h'}function exportPDF(){if(!db.profile.name)return alert('Bitte zuerst das Profil speichern.');if(window.AzubiLog)AzubiLog.printPage();else window.print()}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='azubilog-sicherung.json';a.click();URL.revokeObjectURL(u)}function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.profile||!Array.isArray(x.entries))throw 0;db=x;persist();render();alert('Sicherung importiert')}catch{alert('Datei ist keine gültige AzubiLog-Sicherung')}};r.readAsText(f)}$('date').value=iso(new Date());render();</script></body></html>
